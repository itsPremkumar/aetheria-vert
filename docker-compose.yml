    environment:
      - VERTICAL=customer-service
      - REDIS_URL=redis://redis:6379/6
      - DATABASE_URL=postgresql://hermes:${DB_PASSWORD}@postgres:5432/aetheria_customer_service
      - LANGCHAIN_ENDPOINT=http://langsmith:1984
    depends_on:
      - redis
      - postgres
    healthcheck:
