  aetheria-research:
    build:
      context: .
      dockerfile: Dockerfile.kg
      args:
        VERTICAL: research
    image: ghcr.io/itspremkumar/aetheria-research:latest
    container_name: aetheria-research
    ports:
      - "8008:8000"
    environment:
      - VERTICAL=research
      - REDIS_URL=redis://redis:6379/7
      - DATABASE_URL=postgresql://hermes:${DB_PASSWORD}@postgres:5432/aetheria_research
      - LANGCHAIN_ENDPOINT=http://langsmith:1984
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    networks:
      - aetheria-net

  # ===========================================
  # Orchestration Layer
  # ===========================================

  api-gateway:
    image: nginx:alpine
    container_name: aetheria-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/certs:/etc/nginx/certs:ro
    depends_on:
      - aetheria-healthcare
      - aetheria-legal
      - aetheria-education
      - aetheria-finance
      - aetheria-agriculture
      - aetheria-manufacturing
      - aetheria-customer-service
      - aetheria-research
    networks:
      - aetheria-net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: ghcr.io/itspremkuma/aetheria-orchestrator:latest
    container_name: aetheria-orchestrator
    environment:
      - HEALTHCARE_URL=http://aetheria-healthcare:8000
      - LEGAL_URL=http://aetheria-legal:8000
      - EDUCATION_URL=http://aetheria-education:8000
      - FINANCE_URL=http://aetheria-finance:8000
      - AGRICULTURE_URL=http://aetheria-agriculture:8000
      - MANUFACTURING_URL=http://aetheria-manufacturing:8000
      - CUSTOMER_SERVICE_URL=http://aetheria-customer-service:8000
      - RESEARCH_URL=http://aetheria-research:8000
      - REDIS_URL=redis://redis:6379/8
    depends_on:
      - redis
      - kafka
    networks:
      - aetheria-net

  # ===========================================
  # Infrastructure Services
  # ===========================================

  redis:
    image: redis:7-alpine
    container_name: aetheria-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aetheria-net

  postgres:
    image: postgres:16-alpine
    container_name: aetheria-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hermes
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=aetheria
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aetheria-net

  neo4j:
    image: neo4j:5-community
    container_name: aetheria-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j-data:/data
    networks:
      - aetheria-net

  kafka:
    image: confluentinc/cp-kafka:7.5
    container_name: aetheria-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    networks:
      - aetheria-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5
    container_name: aetheria-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aetheria-net

  langsmith:
    image: langsmith/langserve:latest
    container_name: aetheria-langsmith
    ports:
      - "1984:1984"
    environment:
      - LANGCHAIN_TRACING_V2=true
      - LANGCHAIN_PROJECT=aetheria
    volumes:
      - langsmith-data:/data
    networks:
      - aetheria-net

  # ===========================================
  # Monitoring Stack
  # ===========================================

  prometheus:
    image: prom/prometheus:v2.53
    container_name: aetheria-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - aetheria-net

  grafana:
    image: grafana/grafana:11.1
    container_name: aetheria-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - aetheria-net

  alertmanager:
    image: prom/alertmanager:v0.27
    container_name: aetheria-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - aetheria-net

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: aetheria-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - aetheria-net

  node-exporter:
    image: prom/node-exporter:v1.8
    container_name: aetheria-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - aetheria-net

  # ===========================================
  # Benchmark Runner
  # ===========================================

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.benchmark
    image: ghcr.io/itspremkuma/aetheria-benchmark:latest
    container_name: aetheria-benchmark
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:8000
      - REDIS_URL=redis://redis:6379/9
      - REPORTS_DIR=/reports
    volumes:
      - benchmark-reports:/reports
    depends_on:
      - orchestrator
      - redis
    networks:
      - aetheria-net
    profiles:
      - benchmark

networks:
  aetheria-net:
    driver: bridge
    name: aetheria-net

volumes:
  redis-data:
    name: aetheria-redis-data
  postgres-data:
    name: aetheria-postgres-data
  neo4j-data:
    name: aetheria-neo4j-data
  langsmith-data:
    name: aetheria-langsmith-data
  prometheus-data:
    name: aetheria-prometheus-data
  grafana-data:
    name: aetheria-grafana-data
  benchmark-reports:
    name: aetheria-benchmark-reports
