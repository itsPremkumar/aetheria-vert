version: "3.9"

services:
  # ===========================================
  # Aetheria Core Services
  # ===========================================
  
  aetheria-healthcare:
    build:
      context: .
      dockerfile: Dockerfile.kg
      args:
        VERTICAL: healthcare
    image: ghcr.io/itspremkumar/aetheria-healthcare:latest
    container_name: aetheria-healthcare
    ports:
      - "8001:8000"
    environment:
      - VERTICAL=healthcare
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://hermes:${DB_PASSWORD}@postgres:5432/aetheria_healthcare
      - LANGCHAIN_ENDPOINT=http://langsmith:1984
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
    networks:
      - aetheria-net

  aetheria-legal:
    build:
      context: .
      dockerfile: Dockerfile.kg
      args:
        VERTICAL: legal
    image: ghcr.io/itspremkumar/aetheria-legal:latest
    container_name: aetheria-legal
    ports:
      - "8002:8000"
    environment:
      - VERTICAL=legal
      - REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://hermes:${DB_PASSWORD}@postgres:5432/aetheria_legal
