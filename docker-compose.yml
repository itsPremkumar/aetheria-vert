version: "3.9"

services:
  aetheria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetheria-vert
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import aetheria"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
