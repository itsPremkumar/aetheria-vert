# Pod Disruption Budgets for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aetheria-healthcare-pdb
  namespace: aetheria-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aetheria-healthcare
