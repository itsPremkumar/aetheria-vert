# Production Kubernetes Manifests — Higher replicas, HPA, PDB
# Apply with: kubectl apply -f deploy/kubernetes/production/

# Horizontal Pod Autoscaler for all verticals
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aetheria-healthcare-hpa
  namespace: aetheria-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aetheria-healthcare
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
