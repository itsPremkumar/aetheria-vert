# Kubernetes Manifests for all 8 Aetheria Vertical KGs — Staging
# Apply with: kubectl apply -f deploy/kubernetes/staging/

# Legal KG
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheria-legal
  namespace: aetheria-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetheria-legal
  template:
    metadata:
      labels:
        app: aetheria-legal
    spec:
      containers:
        - name: legal
          image: ghcr.io/itspremkumar/aetheria-legal:latest
          ports:
            - containerPort: 8000
          env:
            - name: VERTICAL
              value: "legal"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aetheria-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aetheria-secrets
                  key: database-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: aetheria-legal
  namespace: aetheria-staging
spec:
  selector:
    app: aetheria-legal
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
