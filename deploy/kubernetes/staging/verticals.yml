# Orchestrator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheria-orchestrator
  namespace: aetheria-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetheria-orchestrator
  template:
    metadata:
      labels:
        app: aetheria-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: ghcr.io/itspremkuma/aetheria-orchestrator:latest
          ports:
            - containerPort: 8000
          env:
            - name: HEALTHCARE_URL
              value: "http://aetheria-healthcare:80"
            - name: LEGAL_URL
              value: "http://aetheria-legal:80"
            - name: EDUCATION_URL
              value: "http://aetheria-education:80"
            - name: FINANCE_URL
              value: "http://aetheria-finance:80"
            - name: AGRICULTURE_URL
              value: "http://aetheria-agriculture:80"
            - name: MANUFACTURING_URL
              value: "http://aetheria-manufacturing:80"
            - name: CUSTOMER_SERVICE_URL
              value: "http://aetheria-customer-service:80"
            - name: RESEARCH_URL
              value: "http://aetheria-research:80"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: aetheria-orchestrator
  namespace: aetheria-staging
spec:
  selector:
    app: aetheria-orchestrator
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetheria-ingress
  namespace: aetheria-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-staging
spec:
  rules:
    - host: staging.aetheria.local
      http:
        paths:
          - path: /healthcare
            pathType: Prefix
            backend:
              service:
                name: aetheria-healthcare
                port:
                  number: 80
          - path: /legal
            pathType: Prefix
            backend:
              service:
                name: aetheria-legal
                port:
                  number: 80
          - path: /education
            pathType: Prefix
            backend:
              service:
                name: aetheria-education
                port:
                  number: 80
          - path: /finance
            pathType: Prefix
            backend:
              service:
                name: aetheria-finance
                port:
                  number: 80
          - path: /agriculture
            pathType: Prefix
            backend:
              service:
                name: aetheria-agriculture
                port:
                  number: 80
          - path: /manufacturing
            pathType: Prefix
            backend:
              service:
                name: aetheria-manufacturing
                port:
                  number: 80
          - path: /customer-service
            pathType: Prefix
            backend:
              service:
                name: aetheria-customer-service
                port:
                  number: 80
          - path: /research
            pathType: Prefix
            backend:
              service:
                name: aetheria-research
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aetheria-orchestrator
                port:
                  number: 80
  tls:
    - hosts:
        - staging.aetheria.local
      secretName: aetheria-tls-staging
