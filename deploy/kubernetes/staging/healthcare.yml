apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetheria-healthcare
  namespace: aetheria-staging
  labels:
    app: aetheria-healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aetheria-healthcare
  template:
    metadata:
      labels:
        app: aetheria-healthcare
    spec:
      containers:
        - name: healthcare
          image: ghcr.io/itspremkumar/aetheria-healthcare:latest
          ports:
            - containerPort: 8000
          env:
            - name: VERTICAL
              value: "healthcare"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: aetheria-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aetheria-secrets
                  key: database-url
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aetheria-healthcare
  namespace: aetheria-staging
spec:
  selector:
    app: aetheria-healthcare
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
